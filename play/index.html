<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Working German Board Game</title>
  <link rel="icon" href="icon-192.png">
  <!-- Added to a home screen, the game opens full screen and sideways (the app is landscape only). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#140b05">
  <!-- #278 4.5: the phone's app in the browser (ui/'s WebAppHost); not the live web game, which is web/'s index.html. -->
  <style>html, body { margin: 0; height: 100%; background: #140b05; overflow: hidden; }
  /* The app's layout is landscape only: a phone or tablet held upright gets this card over the game instead of a
     squeezed board (Mauro, 2026-11-09: "I can't get out of portrait"). Touch screens only, so a narrow desktop window
     still shows the game. */
  #turn-sideways { display: none; position: fixed; inset: 0; z-index: 10; background: #140b05;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: Georgia, "Times New Roman", serif; color: #f3e3b5; text-align: center; }
  @media (orientation: portrait) and (pointer: coarse) { #turn-sideways { display: flex; } }
  #turn-sideways .plate { max-width: 360px; padding: 28px 22px; border-radius: 18px;
    background: linear-gradient(#4a2c14, #2c180a); border: 3px solid #c9a24a;
    box-shadow: inset 0 0 0 2px #6b4a1c, 0 8px 24px #000a; }
  #turn-sideways h1 { font-size: 24px; margin: 14px 0 8px; color: #f6d77e; }
  #turn-sideways p { font-size: 17px; line-height: 1.4; margin: 0 0 18px; }
  #turn-sideways button { font: inherit; font-size: 19px; font-weight: bold; color: #2c180a; cursor: pointer;
    padding: 14px 26px; min-height: 48px; border-radius: 12px; border: 2px solid #7a5418;
    background: linear-gradient(#f6d77e, #c9a24a 60%, #a37a2c); box-shadow: 0 3px 0 #5a3c10; }
  #turn-sideways .hint { font-size: 14px; opacity: .8; margin: 16px 0 0; }
  #turn-sideways svg { animation: wgbg-tilt 2.4s ease-in-out infinite; }
  @keyframes wgbg-tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #turn-sideways svg { animation: none; } }
  </style>
  <!-- The 3D board's three.js (live3d.js, #278 web-boards), the web game's pinned release; fetched only once the 3D board
       is chosen. wgbgImport keeps that import out of the app's bundle. -->
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <script>globalThis.wgbgImport = path => import(path);</script>
</head>
<body>
  <div id="turn-sideways" role="dialog" aria-labelledby="turn-sideways-title">
    <div class="plate">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="6" width="24" height="52" rx="5"
        fill="none" stroke="#f6d77e" stroke-width="4"/><circle cx="32" cy="50" r="2.5" fill="#f6d77e"/></svg>
      <h1 id="turn-sideways-title">Turn your phone sideways</h1>
      <p id="turn-sideways-text">The game is played with the screen sideways.</p>
      <button id="turn-sideways-full" type="button" hidden>Play full screen</button>
      <p class="hint" id="turn-sideways-hint">If the screen doesn't turn, switch on auto-rotate.</p>
    </div>
  </div>
  <script>
    // The card's words in the game's language: the one picked in Settings (wgbg-app-settings:language, 0 = the
    // phone's, then I18n.languages' order), else the browser's.
    (() => {
      // Compose takes over <body> (ComposeViewport(document.body) clears it), so the card lives beside it, on <html>.
      document.documentElement.appendChild(document.getElementById("turn-sideways"));
      const words = {
        en: ["Turn your phone sideways", "The game is played with the screen sideways.", "Play full screen", "If the screen doesn't turn, switch on auto-rotate."],
        de: ["Dreh dein Handy quer", "Das Spiel wird im Querformat gespielt.", "Im Vollbild spielen", "Wenn sich der Bildschirm nicht dreht, schalte das automatische Drehen ein."],
        it: ["Gira il telefono in orizzontale", "Il gioco si gioca con lo schermo in orizzontale.", "Gioca a schermo intero", "Se lo schermo non ruota, attiva la rotazione automatica."],
        es: ["Gira el teléfono en horizontal", "El juego se juega con la pantalla en horizontal.", "Jugar a pantalla completa", "Si la pantalla no gira, activa la rotación automática."],
        fr: ["Tournez votre téléphone", "Le jeu se joue avec l'écran à l'horizontale.", "Jouer en plein écran", "Si l'écran ne tourne pas, activez la rotation automatique."],
        pt: ["Vire o telemóvel na horizontal", "O jogo joga-se com o ecrã na horizontal.", "Jogar em ecrã inteiro", "Se o ecrã não rodar, ative a rotação automática."],
      };
      const order = ["en", "de", "it", "es", "fr", "pt"];
      let lang = null;
      try { const k = Math.round(parseFloat(localStorage.getItem("wgbg-app-settings:language"))); if (k >= 1) lang = order[k - 1]; } catch (e) {}
      if (!lang) lang = (navigator.language || "en").slice(0, 2).toLowerCase();
      const w = words[lang] || words.en;
      const set = (id, t) => { document.getElementById(id).textContent = t; };
      set("turn-sideways-title", w[0]); set("turn-sideways-text", w[1]); set("turn-sideways-full", w[2]); set("turn-sideways-hint", w[3]);
      // Full screen lets the page turn the screen itself (Chrome on Android), even with auto-rotate off. Safari on an
      // iPhone has neither, so there the card only asks the player to turn the phone.
      const full = document.getElementById("turn-sideways-full");
      const el = document.documentElement;
      const goFull = async () => {
        try { if (!document.fullscreenElement) await el.requestFullscreen({ navigationUI: "hide" }); } catch (e) { return; }
        try { await screen.orientation.lock("landscape"); } catch (e) {}
      };
      if (el.requestFullscreen && screen.orientation && screen.orientation.lock) {
        full.hidden = false;
        full.addEventListener("click", goFull);
      }
      // The app plays full screen; a phone's browser keeps its address bar, about a quarter of a landscape screen
      // (303 of 411 dp on a Pixel 8). So on a touch screen the first tap also takes the game full screen, as the app
      // is. Once per visit: leave full screen (Back) and it stays out.
      if (el.requestFullscreen && matchMedia("(pointer: coarse)").matches) {
        const once = () => { document.removeEventListener("touchend", once, true); goFull(); };
        document.addEventListener("touchend", once, true);
      }
    })();
  </script>
  <!-- Online play (#278): the web game's Firebase bridge. firebase-live.js holds the live config (git-ignored, absent in
       tests: firebase-config.js then picks the emulators; ?emu=host:fs:auth:db points at other ports). In order, before the app. -->
  <script>
    (async () => {
      // The board and theme modules (#300) the game draws: looks.json lists their spec files, each fetched by its path,
      // into globalThis.wgbgLooks before the app starts (WebMain.kt loadLooks), as the web game's index.html does.
      globalThis.wgbgLooks = {};
      try {
        const r = await fetch("looks.json");
        if (r.ok) for (const path of await r.json()) {
          try { const f = await fetch(path); if (f.ok) globalThis.wgbgLooks[path] = await f.text(); } catch (e) {}
        }
      } catch (e) {}
      // The 3D board's models this page serves (models/index.json): the game places only these (WebGameDevice.liveModels).
      try { const r = await fetch("models/index.json"); if (r.ok) globalThis.wgbgModels = await r.json(); } catch (e) {}
      for (const src of ["firebase-live.js", "firebase-config.js", "fire.js", "ui.js"]) {
        const s = document.createElement("script"); s.src = src; s.async = false; document.body.appendChild(s);
      }
    })();
  </script>
</body>
</html>
