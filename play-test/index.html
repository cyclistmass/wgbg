<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Working German Board Game</title>
  <script>
    // #372 diagnostics, only with ?diag in the address: a text panel over the game that says what the page is doing, so
    // an iPhone tester's screenshot shows whether the page froze (the clock stops), the canvas lost its drawing (a
    // "context lost" line) or the game hit an error. It reads nothing private and sends nothing anywhere.
    if (/[?&]diag\b/.test(location.search)) (() => {
      const t0 = performance.now(), lines = [];
      const box = document.createElement("pre");
      box.style.cssText = "position:fixed;left:4px;bottom:4px;z-index:2147483647;margin:0;padding:4px 6px;max-width:70vw;" +
        "max-height:80vh;overflow:hidden;font:11px/1.25 monospace;color:#0f0;background:#000c;pointer-events:none;white-space:pre-wrap";
      const head = document.createElement("div"), body = document.createElement("div");
      box.append(head, body);
      const add = m => { lines.push(((performance.now() - t0) / 1000).toFixed(1) + "s " + m); if (lines.length > 30) lines.shift(); body.textContent = lines.join("\n"); };
      window.wgbgDiag = add;
      const mount = () => { if (!box.isConnected) document.documentElement.appendChild(box); };
      mount(); addEventListener("DOMContentLoaded", mount);
      let frames = 0; const loop = () => { frames++; requestAnimationFrame(loop); }; requestAnimationFrame(loop);
      const canvases = [];
      const getContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (kind, ...rest) {
        const ctx = getContext.call(this, kind, ...rest);
        if (ctx && !canvases.includes(this) && /webgl/.test(kind)) {
          canvases.push(this); add("got " + kind + " context, asked " + JSON.stringify(rest[0] || {}));
          // v2 (#372): what this phone's WebGL offers, to tell which graphics step returns nothing.
          try {
            const g = ctx, d = g.getExtension("WEBGL_debug_renderer_info");
            add("gl " + g.getParameter(g.VERSION) + " | " + (d ? g.getParameter(d.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER)));
            add("gl got " + JSON.stringify(g.getContextAttributes()) + " lost " + g.isContextLost());
            add("gl maxTex " + g.getParameter(g.MAX_TEXTURE_SIZE) + " maxRb " + g.getParameter(g.MAX_RENDERBUFFER_SIZE) +
              " samples " + g.getParameter(g.SAMPLES) + " stencil " + g.getParameter(g.STENCIL_BITS) + " err " + g.getError());
          } catch (e) { add("gl info failed " + e); }
          this.addEventListener("webglcontextlost", () => add("WEBGL CONTEXT LOST"));
          this.addEventListener("webglcontextrestored", () => add("webgl context restored"));
        }
        return ctx;
      };
      // v3 (#372): on an error, the whole screen becomes the error's stack, one call per line, names only (no file
      // addresses), so one screenshot holds every frame; it scrolls if it is still too long.
      let shown = false;
      const showStack = (msg, stack) => {
        if (shown) return; shown = true;
        const calls = String(stack || "").split("\n").map(l => l.trim()).filter(Boolean)
          .map(l => l.replace(/@?(https?:|blob:|webpack:)\S*/g, "").replace(/\s+/g, " ").trim()).filter(Boolean);
        const full = document.createElement("pre");
        full.style.cssText = "position:fixed;inset:0;z-index:2147483647;margin:0;padding:6px;overflow:auto;-webkit-overflow-scrolling:touch;" +
          "font:10px/1.15 monospace;color:#0f0;background:#000;white-space:pre-wrap;word-break:break-all";
        full.textContent = "#372 ERROR " + msg + "\n" + calls.slice(0, 80).map((c, i) => i + " " + c.slice(0, 140)).join("\n");
        document.documentElement.appendChild(full);
      };
      addEventListener("error", e => {
        add("ERROR " + (e.message || e) + " @" + (e.lineno || ""));
        showStack(e.message || e, e.error && e.error.stack);
      });
      addEventListener("unhandledrejection", e => add("REJECT " + (e.reason && (e.reason.message || e.reason))));
      const err = console.error; console.error = (...a) => { add("console.error " + a.map(String).join(" ").slice(0, 160)); err.apply(console, a); };
      addEventListener("resize", () => add("resize " + innerWidth + "x" + innerHeight));
      addEventListener("orientationchange", () => add("orientationchange"));
      addEventListener("pagehide", () => add("pagehide"));
      document.addEventListener("visibilitychange", () => add("visibility " + document.visibilityState));
      setInterval(() => {
        mount();
        const c = canvases[0];
        head.textContent = "clock " + ((performance.now() - t0) / 1000).toFixed(1) + "s frames " + frames + " | " + innerWidth + "x" + innerHeight +
          " dpr " + devicePixelRatio + " | screen " + (window.__wgbgScreen || "-") +
          " | canvas " + (c ? c.width + "x" + c.height + " css " + c.clientWidth + "x" + c.clientHeight : "none");
      }, 250);
      add("diag on, " + navigator.userAgent.replace(/^Mozilla\/5\.0 /, "").slice(0, 120));
    })();
  </script>
  <link rel="icon" href="icon-192.png">
  <!-- Added to a home screen, the game opens full screen and sideways (the app is landscape only). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#140b05">
  <!-- #278 4.5: the phone's app in the browser (ui/'s WebAppHost); not the live web game, which is web/'s index.html. -->
  <style>html, body { margin: 0; height: 100%; background: #140b05; overflow: hidden; }
  /* The app's layout is landscape only: a phone or tablet held upright gets this card over the game instead of a
     squeezed board (Mauro, 2026-11-09: "I can't get out of portrait"). Touch screens only, so a narrow desktop window
     still shows the game. */
  #turn-sideways { display: none; position: fixed; inset: 0; z-index: 10; background: #140b05;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: Georgia, "Times New Roman", serif; color: #f3e3b5; text-align: center; }
  @media (orientation: portrait) and (pointer: coarse) { #turn-sideways { display: flex; } }
  #turn-sideways .plate { max-width: 360px; padding: 28px 22px; border-radius: 18px;
    background: linear-gradient(#4a2c14, #2c180a); border: 3px solid #c9a24a;
    box-shadow: inset 0 0 0 2px #6b4a1c, 0 8px 24px #000a; }
  #turn-sideways h1 { font-size: 24px; margin: 14px 0 8px; color: #f6d77e; }
  #turn-sideways p { font-size: 17px; line-height: 1.4; margin: 0 0 18px; }
  #turn-sideways button { font: inherit; font-size: 19px; font-weight: bold; color: #2c180a; cursor: pointer;
    padding: 14px 26px; min-height: 48px; border-radius: 12px; border: 2px solid #7a5418;
    background: linear-gradient(#f6d77e, #c9a24a 60%, #a37a2c); box-shadow: 0 3px 0 #5a3c10; }
  #turn-sideways .hint { font-size: 14px; opacity: .8; margin: 16px 0 0; }
  #turn-sideways svg { animation: wgbg-tilt 2.4s ease-in-out infinite; }
  @keyframes wgbg-tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #turn-sideways svg { animation: none; } }
  /* No install needed (LeRoy, 2026-11-10: Chrome's "Install app" offer worried him; Mauro: keep installing as an option,
     but say plainly the game runs right here in the browser). Shown once, when the browser makes its install offer. */
  #no-install { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 9; max-width: min(520px, calc(100% - 32px));
    display: none; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 12px; box-sizing: border-box;
    background: linear-gradient(#4a2c14, #2c180a); border: 2px solid #c9a24a; box-shadow: 0 6px 18px #000a;
    font-family: Georgia, "Times New Roman", serif; color: #f3e3b5; font-size: 15px; line-height: 1.35; }
  #no-install.shown { display: flex; }
  #no-install button { font: inherit; font-weight: bold; color: #2c180a; cursor: pointer; padding: 8px 14px; min-height: 40px;
    border-radius: 10px; border: 2px solid #7a5418; background: linear-gradient(#f6d77e, #c9a24a 60%, #a37a2c); flex: none; }
  </style>
  <!-- The 3D board's three.js (live3d.js, #278 web-boards), the web game's pinned release; fetched only once the 3D board
       is chosen. wgbgImport keeps that import out of the app's bundle. -->
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <script>globalThis.wgbgImport = path => import(path);</script>
</head>
<body>
  <div id="turn-sideways" role="dialog" aria-labelledby="turn-sideways-title">
    <div class="plate">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="6" width="24" height="52" rx="5"
        fill="none" stroke="#f6d77e" stroke-width="4"/><circle cx="32" cy="50" r="2.5" fill="#f6d77e"/></svg>
      <h1 id="turn-sideways-title">Turn your phone sideways</h1>
      <p id="turn-sideways-text">The game is played with the screen sideways.</p>
      <button id="turn-sideways-full" type="button" hidden>Play full screen</button>
      <p class="hint" id="turn-sideways-hint">If the screen doesn't turn, switch on auto-rotate.</p>
    </div>
  </div>
  <div id="no-install" role="status"><span id="no-install-text">No need to install anything: the game plays right here in your browser. Installing is optional and only adds an icon.</span>
    <button id="no-install-ok" type="button">Got it</button></div>
  <script>
    // The browser offers to install the game (Chrome's "Install app"): say once that nothing needs installing. The offer
    // itself stays: installing is an option, never needed. The words follow the game's language, like the card below.
    (() => {
      const box = document.getElementById("no-install");
      document.documentElement.appendChild(box);   // Compose clears <body>
      const words = {
        en: ["No need to install anything: the game plays right here in your browser. Installing is optional and only adds an icon.", "Got it"],
        de: ["Du musst nichts installieren: das Spiel läuft direkt hier im Browser. Installieren ist freiwillig und legt nur ein Symbol an.", "Verstanden"],
        it: ["Non serve installare niente: il gioco funziona qui nel browser. Installarlo è facoltativo e aggiunge solo un'icona.", "Ho capito"],
        es: ["No hace falta instalar nada: el juego funciona aquí mismo en tu navegador. Instalarlo es opcional y solo añade un icono.", "Entendido"],
        fr: ["Rien à installer : le jeu fonctionne ici même, dans ton navigateur. L'installer est facultatif et ajoute seulement une icône.", "Compris"],
        pt: ["Não precisa instalar nada: o jogo funciona aqui mesmo no navegador. Instalar é opcional e só adiciona um ícone.", "Entendi"],
      };
      const order = ["en", "de", "it", "es", "fr", "pt"];
      let lang = null, seen = false;
      try { const k = Math.round(parseFloat(localStorage.getItem("wgbg-app-settings:language"))); if (k >= 1) lang = order[k - 1]; } catch (e) {}
      try { seen = localStorage.getItem("wgbg-no-install-seen") === "1"; } catch (e) {}
      if (!lang) lang = (navigator.language || "en").slice(0, 2).toLowerCase();
      const w = words[lang] || words.en;
      document.getElementById("no-install-text").textContent = w[0];
      const ok = document.getElementById("no-install-ok");
      ok.textContent = w[1];
      ok.addEventListener("click", () => { box.classList.remove("shown"); try { localStorage.setItem("wgbg-no-install-seen", "1"); } catch (e) {} });
      // Not preventDefault(): the browser's own install button stays where it was.
      // It goes by itself after 12 s (tutor round 2: left up, it covered the game's top banner for a whole game), and
      // counts as seen once shown, so it says its piece once.
      if (!seen) addEventListener("beforeinstallprompt", () => {
        box.classList.add("shown");
        try { localStorage.setItem("wgbg-no-install-seen", "1"); } catch (e) {}
        setTimeout(() => box.classList.remove("shown"), 12000);
      }, { once: true });
    })();
  </script>
  <script>
    // The card's words in the game's language: the one picked in Settings (wgbg-app-settings:language, 0 = the
    // phone's, then I18n.languages' order), else the browser's.
    (() => {
      // Compose takes over <body> (ComposeViewport(document.body) clears it), so the card lives beside it, on <html>.
      document.documentElement.appendChild(document.getElementById("turn-sideways"));
      const words = {
        en: ["Turn your phone sideways", "The game is played with the screen sideways.", "Play full screen", "If the screen doesn't turn, switch on auto-rotate."],
        de: ["Dreh dein Handy quer", "Das Spiel wird im Querformat gespielt.", "Im Vollbild spielen", "Wenn sich der Bildschirm nicht dreht, schalte das automatische Drehen ein."],
        it: ["Gira il telefono in orizzontale", "Il gioco si gioca con lo schermo in orizzontale.", "Gioca a schermo intero", "Se lo schermo non ruota, attiva la rotazione automatica."],
        es: ["Gira el teléfono en horizontal", "El juego se juega con la pantalla en horizontal.", "Jugar a pantalla completa", "Si la pantalla no gira, activa la rotación automática."],
        fr: ["Tournez votre téléphone", "Le jeu se joue avec l'écran à l'horizontale.", "Jouer en plein écran", "Si l'écran ne tourne pas, activez la rotation automatique."],
        pt: ["Vire o telemóvel na horizontal", "O jogo joga-se com o ecrã na horizontal.", "Jogar em ecrã inteiro", "Se o ecrã não rodar, ative a rotação automática."],
      };
      const order = ["en", "de", "it", "es", "fr", "pt"];
      let lang = null;
      try { const k = Math.round(parseFloat(localStorage.getItem("wgbg-app-settings:language"))); if (k >= 1) lang = order[k - 1]; } catch (e) {}
      if (!lang) lang = (navigator.language || "en").slice(0, 2).toLowerCase();
      const w = words[lang] || words.en;
      const set = (id, t) => { document.getElementById(id).textContent = t; };
      set("turn-sideways-title", w[0]); set("turn-sideways-text", w[1]); set("turn-sideways-full", w[2]); set("turn-sideways-hint", w[3]);
      // Full screen lets the page turn the screen itself (Chrome on Android), even with auto-rotate off. Safari on an
      // iPhone has neither, so there the card only asks the player to turn the phone.
      const full = document.getElementById("turn-sideways-full");
      const el = document.documentElement;
      const goFull = async () => {
        try { if (!document.fullscreenElement) await el.requestFullscreen({ navigationUI: "hide" }); } catch (e) { return; }
        try { await screen.orientation.lock("landscape"); } catch (e) {}
      };
      if (el.requestFullscreen && screen.orientation && screen.orientation.lock) {
        full.hidden = false;
        full.addEventListener("click", goFull);
      }
      // The app plays full screen; a phone's browser keeps its address bar, about a quarter of a landscape screen
      // (303 of 411 dp on a Pixel 8). So on a touch screen the first tap also takes the game full screen, as the app
      // is. Once per visit: leave full screen (Back) and it stays out.
      if (el.requestFullscreen && matchMedia("(pointer: coarse)").matches) {
        const once = () => { document.removeEventListener("touchend", once, true); goFull(); };
        document.addEventListener("touchend", once, true);
      }
    })();
  </script>
  <!-- Online play (#278): the web game's Firebase bridge. firebase-live.js holds the live config (git-ignored, absent in
       tests: firebase-config.js then picks the emulators; ?emu=host:fs:auth:db points at other ports). In order, before the app. -->
  <script>
    (async () => {
      // The board and theme modules (#300) the game draws: looks.json lists their spec files, each fetched by its path,
      // into globalThis.wgbgLooks before the app starts (WebMain.kt loadLooks), as the web game's index.html does.
      globalThis.wgbgLooks = {};
      try {
        const r = await fetch("looks.json");
        if (r.ok) for (const path of await r.json()) {
          try { const f = await fetch(path); if (f.ok) globalThis.wgbgLooks[path] = await f.text(); } catch (e) {}
        }
      } catch (e) {}
      // The 3D board's models this page serves (models/index.json): the game places only these (WebGameDevice.liveModels).
      try { const r = await fetch("models/index.json"); if (r.ok) globalThis.wgbgModels = await r.json(); } catch (e) {}
      // The Master bot's networks (value-*.onnx, the phone's own files): read into the bot before the app starts (WebMain.kt
      // loadNets). Without them Master plays as the Strong bot, as a phone with a missing model does.
      globalThis.wgbgNets = {};
      await Promise.all(["value-base.onnx", "value-chivalry.onnx"].map(async n => {
        try { const r = await fetch(n); if (r.ok) globalThis.wgbgNets[n] = new Uint8Array(await r.arrayBuffer()); } catch (e) {}
      }));
      // #372: an iPhone opened upright, then turned sideways, showed a white page (a tester, 2026-11-11). Two changes,
      // until a real iPhone shows which one it needed:
      // 1. On a touch screen held upright the card covers the game anyway: start the game only once the screen is
      //    sideways, so the first turn needs no resize of the game's canvas.
      // 2. On an iPhone or iPad the canvas draws at most 2 device pixels per CSS pixel (iPhones report 3): a third of the
      //    memory less per canvas, and Safari keeps the old and the new one while the screen turns.
      const upright = matchMedia("(orientation: portrait) and (pointer: coarse)");
      if (upright.matches && !/[?&]nowait\b/.test(location.search)) await new Promise(go => {
        const check = () => { if (!upright.matches) { upright.removeEventListener("change", check); go(); } };
        upright.addEventListener("change", check);
      });
      const apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const ratio = Object.getOwnPropertyDescriptor(Window.prototype, "devicePixelRatio") || Object.getOwnPropertyDescriptor(window, "devicePixelRatio");
      if (apple && ratio && ratio.get && !/[?&]dpr=native\b/.test(location.search)) {
        try { Object.defineProperty(window, "devicePixelRatio", { configurable: true, get() { return Math.min(2, ratio.get.call(window)); } }); } catch (e) {}
      }
      if (window.wgbgDiag) window.wgbgDiag("starting the game");
      for (const src of ["firebase-live.js", "firebase-config.js", "fire.js", "ui.js"]) {
        const s = document.createElement("script"); s.src = src; s.async = false; document.body.appendChild(s);
      }
    })();
  </script>
</body>
</html>
